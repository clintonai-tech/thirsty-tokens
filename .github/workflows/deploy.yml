name: Deploy
on:
  push:
    branches: [main]
    paths: [backend/**, infra/**, pyproject.toml, uv.lock, .github/workflows/deploy.yml]
  workflow_dispatch:

# One deploy at a time; never cancel a running deploy half-way.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  id-token: write # OIDC token for AWS
  contents: read

jobs:
  deploy:
    # arm64 runner so the Lambda image builds natively (no QEMU)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          # Set as a repository variable after deploying GithubOidcStack (see README).
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-north-1
      - run: npm ci
        working-directory: infra
      - run: npx cdk deploy ThirstyTokensStack --require-approval never
        working-directory: infra
