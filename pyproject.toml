[project]
name = "thirsty-tokens"
version = "0.1.0"
description = "Compare LLMs on cost, speed, energy, carbon, and water."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
dependencies = [
    "boto3>=1.43.109",
    "fastapi>=0.143.0",
    "litellm>=1.104.2",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.28.1",
    "types-pyyaml>=6.0.12.20260906",
    "moto[dynamodb]>=5.2.3",
    "boto3-stubs[dynamodb]>=1.43.110",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend/src"]

[tool.ruff]
line-length = 100
src = ["backend/src", "backend/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["backend/src"]
